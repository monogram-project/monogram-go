# Sample Monogram Configuration File
# This file demonstrates the configuration options for the monogram tool

# Regex patterns for identifier classification
# These will be used in the future for regex-based identifier classification
simple-label-regex: "in"
compound-label-regex: null
form-prefix-regex: null
form-start-regex: "let"
form-end-regex: null
form-end-wildcard-regex: "end"


# Default configuration values
# These are applied only when the corresponding command-line flag is not used
option-format: "xml"
option-indent: 2
option-default-label: "seq"
option-include-spans: false
option-decimal: false
option-check-literals: true
